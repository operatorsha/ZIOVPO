name: Windows build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item build/Release/ZIOVPOTrayApp.exe artifact/

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: ZIOVPOTrayApp-Windows-x64
          path: artifact/ZIOVPOTrayApp.exe
